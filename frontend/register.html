<!DOCTYPE html>
<html>


<head>

<title>
Register
</title>


<link rel="stylesheet" href="CSS/style.css">

</head>


<body>


<div class="auth-box">


<h1>
Create Account
</h1>



<input 
id="fullname"
placeholder="Full Name">



<input 
id="email"
type="email"
placeholder="Email">



<input 
id="password"
type="password"
placeholder="Password">



<button onclick="register()">

Register

</button>


<p>

Already have account?

<a href="login.html">
Login
</a>

</p>


</div>


<script>


function register(){


    let fullname =
    document.getElementById("fullname").value.trim();


    let email =
    document.getElementById("email").value.trim();


    let password =
    document.getElementById("password").value.trim();



    // Validation

    if(
        fullname === "" ||
        email === "" ||
        password === ""
    ){

        alert("Please fill all fields");

        return;

    }



    // Create user object

    let user = {

        fullname: fullname,

        email: email,

        password: password

    };



    // Save user

    localStorage.setItem(

        "registeredUser",

        JSON.stringify(user)

    );



    alert("Registration Successful");



    window.location.href =
    "login.html";


}


</script>


</body>

</html>
