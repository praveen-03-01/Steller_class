<!DOCTYPE html>
<html>


<head>

<title>
StellarClass - Login
</title>


<link rel="stylesheet" href="CSS/style.css">

</head>


<body>


<div class="auth-box">


<h1>
StellarClass AI
</h1>


<h2>
Login
</h2>



<input 
id="email"
type="email"
placeholder="Email">



<input 
id="password"
type="password"
placeholder="Password">



<button onclick="login()">

Login

</button>



<p>

Don't have an account?

<a href="register.html">
Register
</a>

</p>



</div>



<script>


function login(){


    let email =
    document.getElementById("email").value.trim();


    let password =
    document.getElementById("password").value.trim();

    if(email === "" || password === ""){


        alert(
            "Please enter email and password"
        );


        return;

    }
    let userData =
    localStorage.getItem("registeredUser");



    if(userData === null){


        alert(
            "No account found. Please register first."
        );


        return;

    }



    let user =
    JSON.parse(userData);


    if(
        email === user.email &&
        password === user.password
    ){


        localStorage.setItem(
            "loggedUser",
            email
        );



        alert(
            "Login Successful"
        );



        window.location.href =
        "dashboard.html";


    }

    else{


        alert(
            "Invalid email or password"
        );


    }


}


</script>
</body>
</html>
